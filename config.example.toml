# Copier ce fichier en config.toml (ignoré par git) et adapter les chemins.
# Les chemins se placent HORS du dépôt. Un chemin relatif se lit depuis le
# dossier de ce fichier ; "~" désigne le dossier personnel.

# Couche froide : archives zip d'origine, jamais modifiées, versions conservées.
